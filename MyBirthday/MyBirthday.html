<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <link rel="shortcut icon" type="image/png" href="./birthdayCake.png"/>
        <title>Happy Birthday - Vũ Bảo Nhi</title>
        <link rel="stylesheet" href="./style.css">
        <link href="https://fonts.googleapis.com/css?family=Wendy+One" rel="stylesheet" type="text/css" />
        <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css" />
        
        <style>
            html, body {
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                min-height: 100vh !important;
                overflow-x: hidden !important;
            }

            /* ================= 1. MÀN HÌNH ĐẾM NGƯỢC 5 4 3 2 1 ================= */
            #intro-screen {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: #1aabe3;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 999999999;
                font-family: 'Montserrat', sans-serif;
                transition: opacity 0.6s ease, visibility 0.6s ease;
                user-select: none;
            }

            #intro-screen.hidden {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }

            #intro-digit {
                text-align: center;
                text-shadow: 12px 15px 0px rgba(49, 78, 99, 0.57);
                font-size: clamp(140px, 45vw, 280px);
                color: rgba(255, 255, 255, 0.97);
                -webkit-text-stroke-color: #1679bf;
                -webkit-text-stroke-width: thin;
                font-weight: 700;
                line-height: 1;
            }

            /* ================= 2. HỘP QUÀ MÀU HỒNG TO ẨN HẾT MỌI THỨ ================= */
            #gift-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: linear-gradient(135deg, #374566, #010203);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 99999999;
                opacity: 0;
                visibility: hidden;
                transition: opacity 0.8s ease, visibility 0.8s;
            }

            #gift-overlay.show-gift {
                opacity: 1;
                visibility: visible;
            }

            #gift-overlay.hide-gift {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }

            .gift-box-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                cursor: pointer;
                animation: bounceGift 2s ease-in-out infinite;
                -webkit-tap-highlight-color: transparent;
            }

            .gift-box {
                position: relative;
                width: 180px;
                height: 160px;
                background: linear-gradient(135deg, #ff4d6d, #ff758f);
                border-radius: 12px;
                box-shadow: 0 15px 35px rgba(255, 77, 109, 0.7), 0 0 25px rgba(255, 182, 193, 0.5);
            }

            .gift-lid {
                position: absolute;
                top: -20px;
                left: -10px;
                width: 200px;
                height: 35px;
                background: linear-gradient(135deg, #ff3355, #ff4d6d);
                border-radius: 8px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            }

            .gift-ribbon-vertical {
                position: absolute;
                top: 0;
                left: 50%;
                transform: translateX(-50%);
                width: 35px;
                height: 100%;
                background: #ffb703;
                box-shadow: inset 0 0 10px rgba(0,0,0,0.15);
            }

            .gift-ribbon-horizontal {
                position: absolute;
                top: 50%;
                left: 0;
                transform: translateY(-50%);
                width: 100%;
                height: 35px;
                background: #ffb703;
                box-shadow: inset 0 0 10px rgba(0,0,0,0.15);
            }

            .gift-bow {
                position: absolute;
                top: -55px;
                left: 50%;
                transform: translateX(-50%);
                width: 70px;
                height: 40px;
            }

            .gift-bow::before, .gift-bow::after {
                content: "";
                position: absolute;
                width: 35px;
                height: 30px;
                border: 6px solid #ffb703;
                border-radius: 50% 50% 0 50%;
                top: 0;
            }

            .gift-bow::before {
                left: -2px;
                transform: rotate(-30deg);
            }

            .gift-bow::after {
                right: -2px;
                transform: rotate(30deg) scaleX(-1);
            }

            .gift-title {
                margin-top: 35px;
                color: white;
                font-family: 'Lobster', cursive;
                font-size: 36px;
                text-shadow: 0 3px 10px rgba(255, 77, 109, 0.8);
                letter-spacing: 1px;
                animation: pulseText 1.5s infinite;
            }

            @keyframes bounceGift {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-12px); }
            }

            @keyframes pulseText {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.06); }
            }

            /* ================= 3. DÒNG CHỮ CHẠY "Đợi xíu nhé :>>>>" ================= */
            #marquee-container {
                position: relative;
                width: 100%;
                margin-top: 25px;
                overflow: hidden;
                height: 40px;
                z-index: 25;
                display: none;
            }

            .marquee-text {
                position: absolute;
                white-space: nowrap;
                font-family: 'Lobster', cursive;
                font-size: 26px;
                color: #ffb3c6;
                text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
                animation: runMarquee 6s linear infinite;
            }

            @keyframes runMarquee {
                0% { transform: translateX(100vw); }
                100% { transform: translateX(-100%); }
            }

            /* ================= 4. GIAO DIỆN CHÍNH (CHUẨN MỌI THIẾT BỊ) ================= */
            .container {
                width: 100% !important;
                min-height: 100vh !important;
                position: relative !important;
                margin: 0 !important;
                padding: 0 0 40px 0 !important;
                box-sizing: border-box !important;
                overflow: hidden !important;
                opacity: 0;
                transition: opacity 1s ease;
            }

            .container.show-main {
                opacity: 1;
            }

            .balloon {
                position: absolute !important;
                top: 15px !important;
                left: 0 !important;
                width: 738px !important;
                height: 360px !important;
                margin: 0 !important;
                padding-top: 30px !important;
                transform-origin: 0 0 !important;
                z-index: 5;
            }

            .avatar {
                position: relative !important;
                top: auto !important;
                left: auto !important;
                transform: none !important;
                margin: 0 auto !important;
                text-align: center !important;
                width: 100% !important;
                z-index: 20 !important;
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                justify-content: center !important;
            }

            .avatar__img {
                position: relative !important;
                top: auto !important;
                left: auto !important;
                width: clamp(130px, 35vw, 185px) !important;
                height: clamp(130px, 35vw, 185px) !important;
                object-fit: cover !important;
                border-radius: 50% !important;
                border: 5px solid rgba(234, 15, 150, 0.9) !important;
                box-shadow: 0 0 25px rgba(255, 107, 129, 0.85), inset 10px 10px 10px rgba(15, 219, 234, 0.9) !important;
                cursor: pointer;
                margin: 0 auto !important;
                display: block !important;
            }

            .avatar__title, h1.avatar__title {
                position: relative !important;
                top: 0 !important;
                left: 0 !important;
                margin: 18px 0 0 0 !important;
                padding: 0 12px !important;
                font-size: clamp(28px, 7.5vw, 44px) !important;
                line-height: 1.25 !important;
                cursor: pointer;
                text-align: center !important;
                width: 100% !important;
                box-sizing: border-box !important;
                color: white !important;
                text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6) !important;
            }

            /* ================= 5. BỨC THƯ MÀU HỒNG (HIỆN SAU KHI HẾT CT.MP3) ================= */
            .love-letter-wrapper {
                margin-top: 15px;
                display: flex;
                flex-direction: column;
                align-items: center;
                cursor: pointer;
                z-index: 30;
                -webkit-tap-highlight-color: transparent;
                opacity: 0;
                visibility: hidden;
                transform: translateY(20px);
                transition: opacity 0.8s ease, transform 0.8s ease, visibility 0.8s;
            }

            .love-letter-wrapper.show-letter {
                opacity: 1;
                visibility: visible;
                transform: translateY(0);
                animation: floatEnvelope 3s ease-in-out infinite;
            }

            .envelope {
                position: relative;
                width: 130px;
                height: 86px;
                background: #ff758f;
                border-radius: 0 0 10px 10px;
                box-shadow: 0 10px 25px rgba(255, 77, 109, 0.65), 0 0 15px rgba(255, 182, 193, 0.4);
                transition: transform 0.3s ease;
            }

            .love-letter-wrapper:hover .envelope {
                transform: scale(1.06);
            }

            .envelope-flap {
                position: absolute;
                top: 0;
                left: 0;
                width: 0;
                height: 0;
                border-left: 65px solid transparent;
                border-right: 65px solid transparent;
                border-top: 52px solid #ff4d6d;
                transform-origin: top center;
                transition: transform 0.45s ease, z-index 0.2s;
                z-index: 4;
                filter: drop-shadow(0 2px 3px rgba(180, 20, 50, 0.3));
            }

            .envelope-pocket {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 0;
                height: 0;
                border-left: 65px solid #ff8fa3;
                border-right: 65px solid #ff8fa3;
                border-top: 43px solid transparent;
                border-bottom: 43px solid #ff6b8b;
                border-radius: 0 0 10px 10px;
                z-index: 3;
            }

            .envelope-paper {
                position: absolute;
                bottom: 6px;
                left: 10px;
                width: 110px;
                height: 70px;
                background: #fff0f3;
                border-radius: 6px;
                z-index: 2;
                transition: transform 0.45s ease;
                display: flex;
                align-items: flex-start;
                justify-content: center;
                padding-top: 10px;
                box-sizing: border-box;
                box-shadow: 0 2px 6px rgba(0,0,0,0.12);
            }

            .envelope-paper span {
                font-size: 14px !important;
                color: #ff4d6d !important;
                position: static !important;
                margin: 0 !important;
                text-transform: none !important;
                font-family: 'Lobster', cursive;
            }

            .heart-seal {
                position: absolute;
                top: 48px;
                left: 50%;
                width: 24px;
                height: 24px;
                background: #e01e37;
                transform: translate(-50%, -50%) rotate(45deg);
                z-index: 5;
                box-shadow: 0 3px 10px rgba(224, 30, 55, 0.75);
                animation: pulseHeart 1.2s infinite;
                transition: opacity 0.3s ease, transform 0.3s ease;
            }

            .heart-seal::before,
            .heart-seal::after {
                content: "";
                position: absolute;
                width: 24px;
                height: 24px;
                background: #e01e37;
                border-radius: 50%;
            }

            .heart-seal::before { left: -12px; top: 0; }
            .heart-seal::after { top: -12px; left: 0; }

            .envelope.open .envelope-flap {
                transform: rotateX(180deg);
                z-index: 1;
            }

            .envelope.open .envelope-paper {
                transform: translateY(-32px);
            }

            .envelope.open .heart-seal {
                opacity: 0;
                transform: translate(-50%, -50%) rotate(45deg) scale(1.5);
            }

            .letter-hint {
                margin-top: 10px;
                color: #ffb3c6;
                font-size: 16px;
                letter-spacing: 0.5px;
                text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
            }

            @keyframes pulseHeart {
                0%, 100% { transform: translate(-50%, -50%) rotate(45deg) scale(1); }
                50% { transform: translate(-50%, -50%) rotate(45deg) scale(1.22); }
            }

            @keyframes floatEnvelope {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-8px); }
            }

            /* ================= 6. LÀM ĐẸP BẢNG LỜI CHÚC ================= */
            .swal-modal {
                width: 88% !important;
                max-width: 420px !important;
                border-radius: 20px !important;
                background: linear-gradient(180deg, #fff0f3 0%, #ffe5ec 100%) !important;
                border: 3px solid #ff8fa3 !important;
                box-shadow: 0 15px 40px rgba(255, 77, 109, 0.5) !important;
            }
            .swal-title {
                color: #d90429 !important;
                font-family: 'Lobster', cursive !important;
                font-size: 28px !important;
            }
            .swal-text {
                text-align: center !important;
                font-size: 19px !important;
                line-height: 1.55 !important;
                color: #590d22 !important;
                word-spacing: normal !important;
            }
            .swal-button {
                background-color: #ff4d6d !important;
                border-radius: 25px !important;
                padding: 8px 28px !important;
                font-size: 18px !important;
                box-shadow: 0 4px 12px rgba(255, 77, 109, 0.5) !important;
            }
        </style>
    </head>

    <body>
        <!-- 1. Màn hình đếm ngược 5 4 3 2 1 -->
        <div id="intro-screen">
            <div id="intro-digit">5</div>
        </div>

        <!-- 2. Hộp quà màu hồng to ẩn hết mọi thứ -->
        <div id="gift-overlay">
            <div class="gift-box-container" onclick="openGiftBox()">
                <div class="gift-bow"></div>
                <div class="gift-box">
                    <div class="gift-lid"></div>
                    <div class="gift-ribbon-vertical"></div>
                    <div class="gift-ribbon-horizontal"></div>
                </div>
                <div class="gift-title">🎁 Mở quà 💝</div>
            </div>
        </div>

        <!-- 3. Giao diện chính chúc mừng sinh nhật -->
        <div class="pyro">
            <div class="before"></div>
            <div class="after"></div>
            <div class="container" id="main-container">
                <div class="balloon" id="balloon-box">
                    <div><span>H</span></div>
                    <div><span>A</span></div>
                    <div><span>P</span></div>
                    <div><span>P</span></div>
                    <div><span>Y</span></div>
                    <div><span>B</span></div>
                    <div><span>I</span></div>
                    <div><span>R</span></div>
                    <div><span>T</span></div>
                    <div><span>H</span></div>
                    <div><span>D</span></div>
                    <div><span>A</span></div>
                    <div><span>Y</span></div>
                </div>
                
                <div class="avatar" id="avatar-box">
                    <!-- Ảnh đại diện -->
                    <img 
                        src="https://i.ibb.co/4c86v9t/IMG-1792043435632-1793205902395.jpg" 
                        onerror="this.onerror=null; this.src='./MyAvatar.jpg';" 
                        alt="Vũ Bảo Nhi" 
                        class="avatar__img" 
                        onclick="openLoveLetter()" 
                    />
                    <!-- Tên -->
                    <h1 onclick="openLoveLetter()" class="avatar__title">Vũ Bảo Nhi</h1>

                    <!-- Dòng chữ chạy "Đợi xíu nhé :>>>>" -->
                    <div id="marquee-container">
                        <div class="marquee-text">Đợi xíu nhé :&gt;&gt;&gt;&gt;</div>
                    </div>

                    <!-- Bức thư màu hồng tình yêu (Ẩn lúc đầu, chỉ hiện sau khi xong ct.mp3) -->
                    <div class="love-letter-wrapper" id="love-letter-box" onclick="openLoveLetter()">
                        <div class="envelope" id="love-envelope">
                            <div class="envelope-flap"></div>
                            <div class="envelope-paper">
                                <span>Happy Birthday</span>
                            </div>
                            <div class="envelope-pocket"></div>
                            <div class="heart-seal"></div>
                        </div>
                        <div class="letter-hint">💌 Ấn vào trái tim để mở thư nhé!</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 4. Âm thanh (Hãy kiểm tra kỹ tên file trong thư mục của bạn có đúng là music.mp3 không) -->
        <audio id="audio-ct" src="./ct.mp3" preload="auto"></audio>
        <audio id="audio-music" src="./music.mp3" preload="auto" loop></audio>

        <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
        <script>
            // ================= CĂN CHỈNH GIAO DIỆN =================
            function fitAllDevices() {
                var balloon = document.getElementById('balloon-box');
                var avatar = document.getElementById('avatar-box');
                if (!balloon || !avatar) return;

                var minX = -150;
                var realWidth = 974;
                var realHeight = 365;

                var screenW = window.innerWidth;
                var screenH = window.innerHeight;

                var scale = (screenW * 0.92) / realWidth;
                if (scale > 1) scale = 1;

                if (screenH < 560) {
                    scale = Math.min(scale, (screenH * 0.36) / realHeight);
                }

                var translateX = (screenW - realWidth * scale) / 2 - (minX * scale);
                var topOffset = screenH < 560 ? 5 : 12;

                balloon.style.top = topOffset + 'px';
                balloon.style.transform = 'translateX(' + translateX + 'px) scale(' + scale + ')';

                var avatarTop = topOffset + (realHeight * scale) + (screenH < 560 ? 10 : 20);
                avatar.style.paddingTop = avatarTop + 'px';
            }

            window.addEventListener('DOMContentLoaded', fitAllDevices);
            window.addEventListener('load', fitAllDevices);
            window.addEventListener('resize', fitAllDevices);

            // ================= XỬ LÝ ÂM THANH & TRÌNH TỰ =================
            var audioCt = document.getElementById("audio-ct");
            var audioMusic = document.getElementById("audio-music");
            var isMusicPlaying = false;

            // Mở khóa âm thanh ngầm khi web tải
            document.addEventListener("DOMContentLoaded", function() {
                [audioCt, audioMusic].forEach(function(aud) {
                    aud.muted = true;
                    aud.play().then(function() {
                        aud.pause();
                        aud.currentTime = 0;
                        aud.muted = false;
                    }).catch(function(){});
                });
            });

            // Khi ct.mp3 phát xong 1 lần -> Ẩn chữ chạy -> Đợi 1 giây -> Phát music.mp3 -> Hiện bức thư
            audioCt.addEventListener("ended", function() {
                var marquee = document.getElementById("marquee-container");
                if (marquee) marquee.style.display = "none";

                setTimeout(function() {
                    audioMusic.currentTime = 0;
                    audioMusic.play().then(function() {
                        isMusicPlaying = true;
                    }).catch(function(error) {
                        console.log("Trình duyệt chặn tự phát music.mp3, đang chờ tương tác người dùng...");
                    });

                    var letterBox = document.getElementById("love-letter-box");
                    if (letterBox) {
                        letterBox.classList.add("show-letter");
                    }
                }, 1000);
            });

            // Xử lý đếm ngược 5 4 3 2 1
            document.addEventListener("DOMContentLoaded", function() {
                var introScreen = document.getElementById("intro-screen");
                var digitEl = document.getElementById("intro-digit");
                var giftOverlay = document.getElementById("gift-overlay");
                var count = 5;

                var timer = setInterval(function() {
                    count--;
                    if (count > 0) {
                        digitEl.innerText = count;
                    } else {
                        clearInterval(timer);
                        digitEl.innerText = "0";
                        introScreen.classList.add("hidden"); // Tắt màn hình đếm ngược
                        giftOverlay.classList.add("show-gift"); // Hiện hộp quà to màu hồng
                    }
                }, 1000);
            });

            // Khi người dùng bấm vào hộp quà "Mở quà"
            function openGiftBox() {
                var giftOverlay = document.getElementById("gift-overlay");
                var mainContainer = document.getElementById("main-container");
                var marquee = document.getElementById("marquee-container");

                // Ẩn hộp quà đi
                giftOverlay.classList.add("hide-gift");

                // Dần hiện ra bản chính (giao diện sinh nhật)
                mainContainer.classList.add("show-main");

                // Hiển thị dòng chữ chạy "Đợi xíu nhé :>>>>"
                if (marquee) marquee.style.display = "block";

                // Phát bài nhạc ct.mp3 đúng 1 lần duy nhất
                audioCt.muted = false;
                audioCt.currentTime = 0;
                audioCt.play().catch(function() {
                    var forcePlay = function() {
                        audioCt.play();
                        document.removeEventListener("click", forcePlay);
                        document.removeEventListener("touchstart", forcePlay);
                    };
                    document.addEventListener("click", forcePlay);
                    document.addEventListener("touchstart", forcePlay);
                });
            }

            // ================= MỞ THƯ TÌNH YÊU & BẢO VỆ PHÁT NHẠC =================
            function openLoveLetter() {
                // Nếu vô tình bài music.mp3 chưa tự phát do rào cản trình duyệt, cú chạm mở thư này sẽ kích hoạt nó luôn
                if (!isMusicPlaying && audioMusic.paused && audioCt.ended) {
                    audioMusic.play().then(function() {
                        isMusicPlaying = true;
                    }).catch(function(){});
                }

                var envelope = document.getElementById("love-envelope");
                if (envelope) {
                    envelope.classList.add("open");
                }

                setTimeout(function() {
                    swal({
                        title: "💌 Gửi Vũ Bảo Nhi 💖",
                        text: "Chúc Bảo Nhi tuổi mới sức khỏe dồi dào, luôn xinh đẹp và gặp nhiều may mắn trong cuộc sống! ✨ Happy Birthday Bảo Nhi ! 🥳",
                        button: {
                            text: "❤️",
                        },
                    }).then(function() {
                        if (envelope) {
                            envelope.classList.remove("open");
                        }
                    });
                }, 350);
            }

            // Lớp bảo vệ bổ sung: Bất kỳ cú chạm nào trên toàn trang sau khi hết bài ct.mp3 cũng sẽ kích hoạt music.mp3 nếu bị kẹt
            document.addEventListener("click", function() {
                if (!isMusicPlaying && audioCt.ended && audioMusic.paused) {
                    audioMusic.play().then(function() {
                        isMusicPlaying = true;
                    }).catch(function(){});
                }
            });
        </script>
    </body>
</html>
