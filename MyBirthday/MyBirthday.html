<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
        <link rel="shortcut icon" type="image/png" href="./birthdayCake.png" />
        <title>Happy Birthday - Vũ Bảo Nhi</title>
        <link rel="stylesheet" href="./style.css" />
        <link href="https://fonts.googleapis.com/css?family=Wendy+One" rel="stylesheet" type="text/css" />

        <style>
            html, body {
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                min-height: 100vh !important;
                overflow-x: hidden !important;
            }

            .container {
                width: 100% !important;
                min-height: 100vh !important;
                position: relative !important;
                margin: 0 !important;
                padding: 0 0 30px 0 !important;
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                justify-content: flex-start !important;
                box-sizing: border-box !important;
                overflow: hidden !important;
            }

            /* Khung bọc ngoài giúp thu phóng bóng bay chuẩn trên mọi màn hình */
            #balloon-scale-wrapper {
                width: 100% !important;
                position: relative !important;
                display: flex !important;
                justify-content: center !important;
                align-items: flex-start !important;
                margin-top: 15px !important;
                z-index: 5;
            }

            .balloon {
                width: 800px !important;
                height: 280px !important;
                position: relative !important;
                top: 0 !important;
                left: 0 !important;
                margin: 0 !important;
                padding: 0 !important;
                transform-origin: top center !important;
                flex-shrink: 0 !important;
            }

            .avatar {
                position: relative !important;
                top: auto !important;
                left: auto !important;
                transform: none !important;
                margin: 15px auto 0 auto !important;
                padding: 0 !important;
                text-align: center !important;
                width: 100% !important;
                z-index: 20 !important;
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
            }

            .avatar__img {
                position: relative !important;
                top: auto !important;
                left: auto !important;
                transform: none !important;
                width: clamp(140px, 38vw, 190px) !important;
                height: clamp(140px, 38vw, 190px) !important;
                object-fit: cover !important;
                border-radius: 50% !important;
                border: 4px solid #ff6b81 !important;
                box-shadow: 0 0 25px rgba(255, 107, 129, 0.85) !important;
                cursor: pointer;
                margin: 0 auto !important;
                display: block !important;
            }

            .avatar__title, h1.avatar__title {
                position: relative !important;
                top: auto !important;
                left: auto !important;
                transform: none !important;
                margin: 18px 0 0 0 !important;
                padding: 0 12px !important;
                font-size: clamp(28px, 7.5vw, 42px) !important;
                line-height: 1.25 !important;
                cursor: pointer;
                text-align: center !important;
                width: 100% !important;
                box-sizing: border-box !important;
            }

            .swal-modal {
                width: 88% !important;
                max-width: 400px !important;
                border-radius: 16px !important;
            }
            .swal-text {
                text-align: center !important;
                font-size: 16px !important;
                line-height: 1.5 !important;
            }
        </style>
    </head>

    <body>
        <div class="pyro">
            <div class="before"></div>
            <div class="after"></div>
            <div class="container">
                <div id="balloon-scale-wrapper">
                    <div class="balloon" id="balloon-box">
                        <div><span>H</span></div>
                        <div><span>A</span></div>
                        <div><span>P</span></div>
                        <div><span>P</span></div>
                        <div><span>Y</span></div>
                        <div><span>B</span></div>
                        <div><span>I</span></div>
                        <div><span>R</span></div>
                        <div><span>T</span></div>
                        <div><span>H</span></div>
                        <div><span>D</span></div>
                        <div><span>A</span></div>
                        <div><span>Y</span></div>
                    </div>
                </div>

                <div class="avatar">
                    <img src="./MyAvatar.jpg" alt="Vũ Bảo Nhi" class="avatar__img" onclick="showMessage()" />
                    <h1 onclick="showMessage()" class="avatar__title">Vũ Bảo Nhi</h1>
                </div>
            </div>
        </div>

        <!-- Trình phát nhạc (chỉ nằm ở trang này để phát ngay sau khi đếm xong 5-4-3-2-1) -->
        <audio id="bg-music" preload="auto" loop>
            <source src="./ct.mp3" type="audio/mpeg" />
            <source src="./music.mp3" type="audio/mpeg" />
        </audio>

        <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
        <script>
            // 1. Tự động căn chỉnh bố cục trên mọi thiết bị
            function optimizeLayout() {
                var wrapper = document.getElementById("balloon-scale-wrapper");
                var balloon = document.getElementById("balloon-box");
                if (!wrapper || !balloon) return;

                var items = balloon.children;
                var minX = Infinity, maxX = -Infinity, maxY = -Infinity;

                for (var i = 0; i < items.length; i++) {
                    var el = items[i];
                    var x = el.offsetLeft;
                    var y = el.offsetTop;
                    var w = el.offsetWidth || 105;
                    var h = el.offsetHeight || 125;
                    if (x < minX) minX = x;
                    if (x + w > maxX) maxX = x + w;
                    if (y + h > maxY) maxY = y + h;
                }

                var realWidth = maxX - minX;
                var realHeight = maxY;
                var screenW = window.innerWidth;
                var screenH = window.innerHeight;

                balloon.style.width = (maxX + minX) + "px";

                var scale = (screenW * 0.94) / realWidth;
                if (scale > 1) scale = 1;

                if (screenH < 500) {
                    scale = Math.min(scale, (screenH * 0.42) / realHeight);
                }

                var offsetX = ((800 - (maxX + minX)) / 2) * scale;
                balloon.style.transform = "translateX(" + offsetX + "px) scale(" + scale + ")";
                wrapper.style.height = (realHeight * scale + 20) + "px";
            }

            window.addEventListener("DOMContentLoaded", optimizeLayout);
            window.addEventListener("load", optimizeLayout);
            window.addEventListener("resize", optimizeLayout);

            // 2. Phát nhạc ngay khi chuyển từ màn đếm ngược 5-4-3-2-1 sang
            function startMusic() {
                var music = document.getElementById("bg-music");
                if (!music) return;
                music.volume = 1.0;

                var playPromise = music.play();
                if (playPromise !== undefined) {
                    playPromise.catch(function () {
                        // Nếu trình duyệt điện thoại chặn tự phát khi chuyển trang,
                        // phát ngay lập tức khi người dùng chạm bất kỳ đâu lên màn hình
                        var unlockAudio = function () {
                            music.play();
                            document.removeEventListener("click", unlockAudio);
                            document.removeEventListener("touchstart", unlockAudio);
                        };
                        document.addEventListener("click", unlockAudio, { once: true });
                        document.addEventListener("touchstart", unlockAudio, { once: true });
                    });
                }
            }

            window.addEventListener("DOMContentLoaded", startMusic);
            window.addEventListener("load", startMusic);

            // 3. Hiển thị lời chúc (đồng thời đảm bảo nhạc phát nếu chưa kêu)
            function showMessage() {
                var music = document.getElementById("bg-music");
                if (music && music.paused) {
                    music.play();
                }
                swal({
                    title: "Lời nhắn",
                    text: "Chúc bạn tuổi mới sức khỏe dồi dào, luôn xinh đẹp và gặp nhiều may mắn trong cuộc sống! ✨ Happy Birthday Bảo Nhi ! 🥳",
                    button: {
                        text: "❤️",
                    },
                });
            }
        </script>
    </body>
</html>
